name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Unzip Project Files
      run: |
        sudo apt-get install -y unzip
        find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

    - name: Prepare and Build APK
      run: |
        # پیدا کردن پوشه اصلی پروژه اندروید
        BUILD_FILE=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "ERROR: build.gradle file not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # تنظیم آدرس SDK اندروید
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # ساخت فایل اجراکننده با نسخه سازگار گریدل (8.4)
        if [ ! -f "./gradlew" ]; then
          echo "Generating compatible Gradle Wrapper..."
          gradle wrapper --gradle-version 8.4
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-PIN-Extractor-APK
        path: "**/build/outputs/apk/debug/*.apk"
