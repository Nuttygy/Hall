name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP File
      run: |
        sudo apt-get install -y unzip
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE"
        fi

    - name: Setup Android Licenses & Properties
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
        fi

    - name: Build Debug APK
      run: |
        BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "ERROR: build.gradle file not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"

        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.7
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-PIN-Extractor-APK
        path: "**/build/outputs/apk/debug/*.apk"
