name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Unzip Project Files
      run: |
        sudo apt-get install -y unzip
        find . -name "*.zip" -exec unzip -o {} \;

    - name: Find Project and Build APK
      run: |
        # Find directory containing build.gradle or build.gradle.kts
        BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "ERROR: build.gradle file not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "gradlew wrapper not found, using system gradle..."
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-PIN-Extractor-APK
        path: "**/build/outputs/apk/debug/*.apk"
