name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP Archive
      run: |
        sudo apt-get install -y unzip
        find . -name "*.zip" -exec unzip -o {} \;

    - name: Setup Android & Build APK
      run: |
        # Find project root directory containing settings.gradle
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        
        if [ -n "$SETTINGS_FILE" ]; then
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        else
          PROJECT_DIR=$(find . -name "build.gradle*" | awk '{print length, $0}' | sort -n | head -n 1 | cut -d" " -f2- | xargs dirname)
        fi

        echo "Project Root: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Create local.properties and accept licenses
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Run Build
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-PIN-Extractor-APK
        path: "**/build/outputs/apk/debug/*.apk"
